[package]
name = "deck-toolbox"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# Windows-only: SSH transport so deck-toolbox can run on a Windows PC and
# execute the same scripts on the Steam Deck remotely.
[target.'cfg(target_os = "windows")'.dependencies]
ssh2 = "0.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }
